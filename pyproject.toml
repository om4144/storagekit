[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storagekit"
dynamic = ["version"]
description = "One API to save, load and auto-expire files on S3-compatible storage, Google Cloud Storage and Azure Blob Storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
keywords = ["storage", "s3", "gcs", "azure", "blob", "object-storage", "ttl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.28",
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.10"]
azure = ["azure-storage-blob>=12.19"]
all = [
    "google-cloud-storage>=2.10",
    "azure-storage-blob>=12.19",
]
dev = [
    "google-cloud-storage>=2.10",
    "azure-storage-blob>=12.19",
    "pytest>=8",
    "pytest-cov>=5",
    "moto[s3]>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[tool.hatch.version]
path = "src/storage/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", ".env.example"]

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["storage"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google.*", "azure.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
